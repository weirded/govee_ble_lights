set_segments:
  name: Set segments
  description: Set colour, colour temperature and/or brightness on individual segments (segmented models such as H6072).
  target:
    entity:
      integration: govee-ble-lights
      domain: light
  fields:
    segments:
      name: Segments
      description: 1-based segment numbers, as numbered in the Govee app (H6072 has 8).
      required: true
      example: [1, 2, 3]
      selector:
        object:
    rgb_color:
      name: RGB colour
      example: [255, 0, 0]
      selector:
        color_rgb:
    color_temp_kelvin:
      name: Colour temperature
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 9000
    brightness_pct:
      name: Segment brightness
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
